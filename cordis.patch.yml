# dsh-fileview — remote-browser file viewer/editor.
#
# Host half serves /dsh-fileview/{meta,file,dir} (read + save + directory
# browse, same-origin fenced, path-allowlisted). On DSH 0.1.2 the Client half
# wraps `ctx.remote.session.openWorkspacePath` by replacing its configurable
# getter-only descriptor. Remote pages open the path in an in-GUI overlay;
# loopback pages retain the native OS opener. Cleanup restores the exact
# original descriptor.
#
# inject: [webServer] makes Cordis wait for the webServer service before
# apply() runs — without it ctx.get('webServer') is undefined and the routes
# never register (same lesson as dsh-notify).
#
# config.roots is the read+write path allowlist (absolute directories; subpaths
# allowed, everything else 403). config.writeRoots optionally narrows writes.
# Required: without at least one root the plugin registers nothing (safe no-op).
# Example:
#   config:
#     roots:
#       - 'D:\workspace'
#       - 'C:\Users\me\projects'
#     writeRoots:            # optional: narrow saves to a subset of roots
#       - 'D:\workspace'
- insert:
    - id: fileview
      name: dsh-fileview
      inject: [webServer]
